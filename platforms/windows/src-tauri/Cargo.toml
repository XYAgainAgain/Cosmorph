[package]
name = "cosmorph-wallpaper"
version = "0.1.0"
description = "Cosmorph standalone desktop wallpaper host"
authors = ["Sam Atwood"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# Disk-usage profile carried over from RainyDesk, where a default dev profile
# grew the target dir into the multi-GB range.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
strip = "symbols"
lto = "thin"
